# PLAN.md §4 "CI/CD pipeline": lint, types, tests, and the eval regression gate on every PR.
# Action inputs verified against each action's action.yml at the pinned tag:
#   https://github.com/actions/checkout/blob/v7/action.yml
#   https://github.com/astral-sh/setup-uv/blob/v10.3.2/action.yml
#   https://github.com/actions/upload-artifact/blob/v7/action.yml
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: ruff
        run: make lint
      - name: mypy --strict (authgraph)
        run: make typecheck
      - name: pytest
        run: make test

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      # Regression gate: fail if any rule's precision or recall drops versus the base branch.
      - name: Baseline report from the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "origin/$BASE_REF"
          if [ -f "$RUNNER_TEMP/base/eval/harness.py" ]; then
            (cd "$RUNNER_TEMP/base" && uv run python eval/harness.py --out "$RUNNER_TEMP/baseline")
          else
            echo "base branch has no eval harness yet; skipping regression baseline"
          fi
      # Phase 0: no rules exist yet, so only the no-regression check runs. Phase 1 switches this
      # to `make eval-gates` (absolute thresholds from eval/gates.yaml).
      - name: Eval (no regression vs base)
        run: make eval BASELINE="$RUNNER_TEMP/baseline/report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-report
          path: eval/reports/
