[project]
name = "accessguard-workspace"
version = "0.0.0"
description = "AccessGuard monorepo root (not published)"
requires-python = ">=3.12"
dependencies = ["authgraph", "accessguard-app", "accessguard-sandbox"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/authgraph", "packages/app", "packages/sandbox"]

[tool.uv.sources]
authgraph = { workspace = true }
accessguard-app = { workspace = true }
accessguard-sandbox = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "pre-commit>=4.0",
    "jsonschema>=4.23",
    "types-jsonschema>=4.26.0.20261006",
    "testcontainers[postgres]>=4.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["eval/mutations", "eval/pairs", "eval/corpus/checkouts", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "E501"]
"**/app_tests/**" = ["S", "E501"]
"**/sandbox_tests/**" = ["S", "E501"]
"packages/sandbox/src/**" = ["S603", "S607"]  # drives the docker CLI with fixed argv
"eval/**" = ["S603", "S607"]
"eval/tools/gen_mutations.py" = ["E501"]  # fixture source text
"deploy/github-app/register.py" = ["E501"]  # inline HTML template and doc URLs
"deploy/e2e/**" = ["S603", "S607"]  # drives git with fixed argv

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["authgraph.*"]
strict = true

[[tool.mypy.overrides]]
module = ["z3", "litellm"]  # litellm: optional extra, not installed by default
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "packages/authgraph/tests",
    "packages/app/app_tests",
    "packages/sandbox/sandbox_tests",
    "eval/tests",
]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
