[project]
name = "accessguard-sandbox"
version = "0.0.1"
description = "Network-less sandbox: replays Supabase migrations in a disposable Postgres (FR-3.8)"
requires-python = ">=3.12"
dependencies = ["authgraph"]

[project.scripts]
accessguard-sandbox = "accessguard_sandbox.cli:main"

[tool.uv.sources]
authgraph = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accessguard_sandbox"]
