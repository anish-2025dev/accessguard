[project]
name = "authgraph"
version = "0.0.1"
description = "AccessGuard analysis engine: who can access what, and did this change make it worse?"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
authgraph = "authgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authgraph"]
