[project]
name = "accessguard-app"
version = "0.0.1"
description = "AccessGuard GitHub App: webhook intake, jobs and reporter (delivery only)"
requires-python = ">=3.12"
dependencies = ["authgraph"]

[tool.uv.sources]
authgraph = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accessguard_app"]
