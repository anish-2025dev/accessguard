repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^eval/(mutations|pairs)/
      - id: end-of-file-fixer
        exclude: ^eval/(mutations|pairs)/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy-authgraph
        name: mypy --strict (authgraph)
        entry: uv run mypy --strict packages/authgraph
        language: system
        pass_filenames: false
        files: ^packages/authgraph/
