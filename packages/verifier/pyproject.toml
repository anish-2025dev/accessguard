[project]
name = "accessguard-verifier"
version = "0.0.1"
description = "Runtime verifier: credential-isolated broker that proves findings against previews (RV-1..4)"
requires-python = ">=3.12"
dependencies = ["authgraph", "cryptography>=44", "httpx>=0.28", "pydantic>=2.9"]

[project.optional-dependencies]
mcp = ["mcp>=1.20"]

[project.scripts]
accessguard-verifier = "accessguard_verifier.cli:main"

[tool.uv.sources]
authgraph = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accessguard_verifier"]
